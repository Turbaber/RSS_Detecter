name: RSS Scan

on:
  schedule:
    - cron: "5 1 * * *"   # 北京时间每天 09:05
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行脚本
        run: python RSS.py

      - name: 上传运行产物
        uses: actions/upload-artifact@v6
        with:
          name: rss-matches
          path: |
            rss_matches.json
            seen_items.json
            docs/high.xml
            docs/mid.xml
            docs/low.xml

      - name: 提交最新结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss_matches.json seen_items.json docs/high.xml docs/mid.xml docs/low.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update RSS results"
          git push
